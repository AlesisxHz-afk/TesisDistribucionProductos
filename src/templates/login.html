<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Acceso al Sistema - Agrícola Alaya S.A.C</title>
    <link rel="shortcut icon" href="/static/images/logo.png" type="image/x-icon" />
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>
    <!-- Fondo ambiental elegante con luces suaves -->
    <div class="ambient-background">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-grid"></div>
    </div>

    <!-- Navegación superior con botón directo al Menú Principal -->
    <header class="auth-top-nav">
        <a href="/" class="btn-back-home" title="Regresar a la página principal">
            <i class="fas fa-arrow-left"></i>
            <span>Volver al Menú Principal</span>
        </a>
        <div class="top-nav-badge">
            <span class="pulse-dot"></span>
            <span>Agrícola Alaya</span>
        </div>
    </header>

    <!-- Contenedor principal de autenticación -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <!-- Cabecera de la tarjeta con Logo -->
            <div class="card-brand">
                <a href="/" class="brand-link" title="Ir al Menú Principal">
                    <img src="/static/images/logo.png" alt="Logo Agrícola Alaya" class="brand-logo">
                </a>
                <h1 class="brand-title">Portal de Acceso</h1>
                <p class="brand-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <!-- Selector de pestañas: Iniciar / Registrar -->
            <div class="form-switcher">
                <button type="button" class="switch-btn active" data-form="login">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Iniciar Sesión</span>
                </button>
                <button type="button" class="switch-btn" data-form="register">
                    <i class="fas fa-user-plus"></i>
                    <span>Registrarse</span>
                </button>
            </div>

            <!-- Contenedor de formularios -->
            <div class="forms-container">
                <!-- FORMULARIO 1: INICIAR SESIÓN -->
                <div id="loginForm" class="form-wrapper active">
                    <form id="loginFormElement" method="POST" class="auth-form" autocomplete="on">
                        <div class="input-field">
                            <label for="username" class="field-label">Usuario</label>
                            <div class="field-control">
                                <i class="fas fa-user field-icon"></i>
                                <input type="text" id="username" name="username" class="form-input" placeholder="Ingresa tu usuario" required autocomplete="username">
                            </div>
                        </div>

                        <div class="input-field">
                            <label for="password" class="field-label">Contraseña</label>
                            <div class="field-control">
                                <i class="fas fa-lock field-icon"></i>
                                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn primary-btn">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>Ingresar al Sistema</span>
                        </button>

                        <div class="auth-card-footer">
                            <p>¿No tienes una cuenta? 
                                <button type="button" id="showRegister" class="link-btn">Regístrate</button>
                            </p>
                            <div class="footer-divider"></div>
                            <a href="/" class="home-direct-link">
                                <i class="fas fa-home"></i> Ir al Menú Principal
                            </a>
                        </div>
                    </form>
                </div>

                <!-- FORMULARIO 2: REGISTRO -->
                <div id="registerForm" class="form-wrapper">
                    <form id="registerFormElement" enctype="multipart/form-data" class="auth-form" autocomplete="off">
                        <!-- Usuario y Contraseña -->
                        <div class="form-row">
                            <div class="input-field">
                                <label for="registerUsername" class="field-label">Usuario <span class="required">*</span></label>
                                <div class="field-control">
                                    <i class="fas fa-at field-icon"></i>
                                    <input type="text" id="registerUsername" class="form-input" placeholder="Ej. jperez" required autocomplete="off">
                                </div>
                            </div>
                            <div class="input-field">
                                <label for="registerPassword" class="field-label">Contraseña <span class="required">*</span></label>
                                <div class="field-control">
                                    <i class="fas fa-lock field-icon"></i>
                                    <input type="password" id="registerPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                                    <button type="button" class="password-toggle" id="toggleRegisterPassword" aria-label="Mostrar u ocultar contraseña">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Tipo de Usuario -->
                        <div class="input-field">
                            <label class="field-label">Tipo de Usuario</label>
                            <div class="type-selector">
                                <div class="type-option active" id="typeRegular">
                                    <i class="fas fa-user"></i>
                                    <span>Usuario Regular</span>
                                </div>
                                <div class="type-option" id="typeConductor">
                                    <i class="fas fa-truck"></i>
                                    <span>Conductor</span>
                                </div>
                            </div>
                            <input type="hidden" id="esConductor" value="false">
                        </div>

                        <!-- Campos exclusivos de conductor -->
                        <div id="conductorFields" class="conductor-box" style="display: none;">
                            <div class="input-field">
                                <label for="registerDNI" class="field-label">DNI del Conductor</label>
                                <div class="field-control search-control">
                                    <i class="fas fa-id-card field-icon"></i>
                                    <input type="tel" id="registerDNI" class="form-input" placeholder="8 dígitos" maxlength="8" inputmode="numeric">
                                    <button type="button" id="buscarDNI" class="btn-search-dni">
                                        <i class="fas fa-search"></i>
                                        <span>Verificar</span>
                                    </button>
                                </div>
                            </div>

                            <div id="driverInfo" class="driver-card" style="display: none;">
                                <div class="driver-header">
                                    <i class="fas fa-check-circle text-success"></i>
                                    <strong>Conductor Verificado</strong>
                                </div>
                                <div class="driver-details">
                                    <div><span>Nombre:</span> <strong id="driverFullName">-</strong></div>
                                    <div><span>Estado:</span> <span id="driverStatus" class="status-active">-</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Datos personales -->
                        <div id="regularFields" class="personal-fields">
                            <div class="input-field">
                                <label for="registerNombres" class="field-label">Nombres <span class="required">*</span></label>
                                <div class="field-control">
                                    <i class="fas fa-user field-icon"></i>
                                    <input type="text" id="registerNombres" class="form-input" placeholder="Nombres" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="input-field">
                                    <label for="registerPaterno" class="field-label">Apellido Paterno <span class="required">*</span></label>
                                    <div class="field-control">
                                        <input type="text" id="registerPaterno" class="form-input" placeholder="Paterno" required>
                                    </div>
                                </div>
                                <div class="input-field">
                                    <label for="registerMaterno" class="field-label">Apellido Materno <span class="required">*</span></label>
                                    <div class="field-control">
                                        <input type="text" id="registerMaterno" class="form-input" placeholder="Materno" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Foto de perfil (opcional) -->
                        <div class="input-field">
                            <label class="field-label">Foto de Perfil <small class="text-muted">(Opcional)</small></label>
                            <div class="photo-dropzone" id="uploadArea">
                                <i class="fas fa-cloud-arrow-up"></i>
                                <span>Subir fotografía</span>
                                <input type="file" id="registerFoto" class="file-hidden" accept="image/*">
                            </div>
                            <div id="previewContainer" class="preview-box" style="display: none;">
                                <img id="imagePreview" src="" alt="Vista previa" class="preview-img">
                                <button type="button" class="remove-preview" aria-label="Eliminar imagen">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="form-actions-row">
                            <button type="submit" id="registerSubmit" class="submit-btn success-btn">
                                <i class="fas fa-user-plus"></i>
                                <span>Crear Cuenta</span>
                            </button>
                            <button type="button" id="cancelRegister" class="cancel-btn">
                                <i class="fas fa-times"></i>
                                <span>Cancelar</span>
                            </button>
                        </div>

                        <div class="auth-card-footer">
                            <p>¿Ya tienes una cuenta? 
                                <button type="button" id="showLogin" class="link-btn">Inicia sesión</button>
                            </p>
                            <div class="footer-divider"></div>
                            <a href="/" class="home-direct-link">
                                <i class="fas fa-home"></i> Ir al Menú Principal
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
